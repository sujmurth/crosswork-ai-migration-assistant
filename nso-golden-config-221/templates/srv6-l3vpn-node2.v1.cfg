
router bgp 65000
 address-family vpnv4 unicast
  segment-routing srv6
   locator MAIN
  exit
 exit
 neighbor 2010::4
  remote-as 65000
  update-source Loopback0
  address-family vpnv4 unicast
   route-policy SRV6_STANDBY_50 in
  exit
 exit
 vrf vpn-101
  address-family ipv4 unicast
   segment-routing srv6
    locator MAIN
    alloc mode per-vrf
   exit
  exit
 exit
exit
!
route-policy SRV6_STANDBY_50
  set local-preference 50
  pass
end-policy
!
